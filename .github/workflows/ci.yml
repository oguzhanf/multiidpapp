name: Build and verify

on:
  push:
    branches: [main, 'poc/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked public packages
        run: dotnet restore MultiIdpApp.slnx --configfile NuGet.Config --locked-mode
      - name: Build
        run: dotnet build MultiIdpApp.slnx -c Release --no-restore
      - name: Focused identity tests
        run: dotnet run --project tests/MultiIdpApp.Tests/MultiIdpApp.Tests.csproj -c Release --no-build --no-restore

  verify-net48:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked Framework packages
        run: dotnet restore samples/net48/MultiIdp.Net48.sln --configfile NuGet.Config --locked-mode -p:MSBuildEnableWorkloadResolver=false
      - name: Build deployed applications
        run: dotnet build samples/net48/MultiIdp.Net48.sln -c Release --no-restore -p:MSBuildEnableWorkloadResolver=false
      - name: Framework authentication and registration tests
        run: ./tests/Net48/bin/Release/net48/Net48.Tests.exe
      - name: Provisioning script tests
        run: ./scripts/poc/Test-PocScripts.ps1
